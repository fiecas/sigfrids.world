<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>sigfrid's world</title>

        <link rel="icon" type="image/x-icon" href="/assets/tubbie.png" />
        <link rel="stylesheet" href="/assets/css-reset.css" />
        <link rel="stylesheet" href="/assets/app.css" />
    </head>
    <body>
        <main>
            <div class="sidebar">
                <h3>articles</h3>

                <div id="articles"></div>
            </div>

            <div class="content">
                <content />

                <a href="/">
                    <img
                        id="tubbie"
                        src="/assets/tubbie.png"
                        alt="me in a teletubbies costume"
                    />
                </a>
            </div>
        </main>

        <script type="module">
            let response = await fetch("/api/articles/get-page?page=0");
            let articles = response.ok ? await response.json() : [];

            let articles_wrapper = document.getElementById("articles");
            if (articles_wrapper)
                for (const article of articles) {
                    console.log(article);
                    let card = document.createElement("div");
                    card.className = "article-card";

                    let link = document.createElement("a");
                    link.href = "/articles/" + article.slug;
                    link.textContent = article.title;
                    card.appendChild(link);

                    if (article.short) {
                        let short = document.createElement("p");
                        short.textContent = article.short;
                        card.appendChild(short);
                    }

                    articles_wrapper.appendChild(card);
                }
        </script>
    </body>
</html>
